name: Desktop releases

on:
  push:
    tags: ['cloudloom-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
      - run: npm ci
      - run: npm run prepare:engine
      - run: npm run lint
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles nsis
      - name: Verify installer and installed application
        run: ./scripts/verify-windows.ps1
      - name: Package Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/Cloudloom_Juniper_Windows_x64_Setup.exe
          $portable = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/Cloudloom-portable" -Force
          Copy-Item src-tauri/target/release/cloudloom.exe $portable.FullName
          Copy-Item src-tauri/resources "$($portable.FullName)/resources" -Recurse
          Compress-Archive -Path "$($portable.FullName)/*" -DestinationPath release-assets/Cloudloom_Juniper_Windows_x64_Portable.zip
          Get-ChildItem release-assets -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release-assets/SHA256SUMS_Windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudloom-Juniper-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            machine: x86_64
          - name: AppleSilicon
            runner: macos-15
            target: aarch64-apple-darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run prepare:engine
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build application and DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Verify packaged application
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          APP_PATH: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Cloudloom.app
        run: node scripts/verify-macos.mjs
      - name: Package download assets
        env:
          TARGET: ${{ matrix.target }}
          ARCH_NAME: ${{ matrix.name }}
        run: |
          mkdir -p release-assets
          cp src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg "release-assets/Cloudloom_Juniper_macOS_$ARCH_NAME.dmg"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/$TARGET/release/bundle/macos/Cloudloom.app" "release-assets/Cloudloom_Juniper_macOS_$ARCH_NAME.zip"
          cd release-assets
          shasum -a 256 ./*.dmg ./*.zip > "SHA256SUMS_$ARCH_NAME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudloom-Juniper-macOS-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish desktop downloads
    if: startsWith(github.ref, 'refs/tags/cloudloom-')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Cloudloom-Juniper-*
          path: release-assets
          merge-multiple: true
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --title "Cloudloom Juniper" --notes-file docs/RELEASE.md --verify-tag --latest
