name: Desktop releases

on:
  push:
    tags: ['cloudloom-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    if: github.repository == 'prostoodin1/cloudloom-desktop' || github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
      - run: npm ci
      - run: npm run prepare:engine
      - run: npm run lint
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed installer
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing secret is required' }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Build untrusted PR without signing secrets
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify installer and installed application
        run: ./scripts/verify-windows.ps1
      - name: Package Windows downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/Cloudloom_Linden_Windows_x64_Setup.exe
          if ('${{ github.event_name }}' -ne 'pull_request') {
            Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig release-assets/Cloudloom_Linden_Windows_x64_Setup.exe.sig
          }
          $portable = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/Cloudloom-portable" -Force
          Copy-Item src-tauri/target/release/cloudloom.exe $portable.FullName
          Copy-Item src-tauri/resources "$($portable.FullName)/resources" -Recurse
          Compress-Archive -Path "$($portable.FullName)/*" -DestinationPath release-assets/Cloudloom_Linden_Windows_x64_Portable.zip
          Get-ChildItem release-assets -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content release-assets/SHA256SUMS_Windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudloom-Linden-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.name }}
    if: github.repository == 'prostoodin1/cloudloom-desktop' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            machine: x86_64
          - name: AppleSilicon
            runner: macos-15
            target: aarch64-apple-darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run prepare:engine
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed application and DMG
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Build untrusted PR without signing secrets
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify packaged application
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          APP_PATH: src-tauri/target/${{ matrix.target }}/release/bundle/macos/Cloudloom.app
        run: node scripts/verify-macos.mjs
      - name: Package download assets
        env:
          TARGET: ${{ matrix.target }}
          ARCH_NAME: ${{ matrix.name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p release-assets
          cp src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg "release-assets/Cloudloom_Linden_macOS_$ARCH_NAME.dmg"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/$TARGET/release/bundle/macos/Cloudloom.app" "release-assets/Cloudloom_Linden_macOS_$ARCH_NAME.zip"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            cp src-tauri/target/"$TARGET"/release/bundle/macos/*.app.tar.gz "release-assets/Cloudloom_Linden_macOS_$ARCH_NAME.app.tar.gz"
            cp src-tauri/target/"$TARGET"/release/bundle/macos/*.app.tar.gz.sig "release-assets/Cloudloom_Linden_macOS_$ARCH_NAME.app.tar.gz.sig"
          fi
          cd release-assets
          shasum -a 256 ./*.dmg ./*.zip > "SHA256SUMS_$ARCH_NAME.txt"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            shasum -a 256 ./*.app.tar.gz ./*.app.tar.gz.sig >> "SHA256SUMS_$ARCH_NAME.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Cloudloom-Linden-macOS-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish desktop downloads
    if: startsWith(github.ref, 'refs/tags/cloudloom-') && github.repository == 'prostoodin1/cloudloom-desktop'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Cloudloom-Linden-*
          path: release-assets
          merge-multiple: true
      - name: Generate complete updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/update-manifest.mjs
      - name: Create public release after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --title "Cloudloom Linden" --notes-file docs/RELEASE.md --verify-tag --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
