[package]
name = "cloudloom"
version = "0.4.0"
description = "A universal desktop cloud file manager for studio-scale media"
authors = ["Studio Red Barcelona"]
license = "UNLICENSED"
repository = "https://github.com/prostoodin1/cloudloom-desktop"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cloudloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
