[package]
name = "cloudloom"
version = "0.8.3"
description = "A universal desktop cloud file manager for studio-scale media"
authors = ["Studio Red Barcelona"]
license = "UNLICENSED"
repository = "https://github.com/prostoodin1/cloudloom-desktop"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cloudloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
